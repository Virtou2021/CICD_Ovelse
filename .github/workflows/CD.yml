name: CD - CiCd

on:
  push: 
    branches: ["master"]

env:
  # ghcr.io are Github packages
  REGISTRY: ghcr.io
  IMAGE_NAME: "cicdovelse"
  GITHUB_ACTOR: "virtou2021"

jobs:
  Build-and-Deploy-CiCd:
    name: Build and Deploy CiCd
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Workflow can write/communicate with packages
      packages: write

    steps:
      - name: Get Code
        uses: actions/checkout@v7
      # Logs into the registry with an instance Github Token
      - name: Log into registry ${{env.REGISTRY}}
        uses: docker/login-action@v4
        with:
          registry: ${{env.REGISTRY}}
          username: ${{env.GITHUB_ACTOR}}
          # Github Tokens logs in without your e-mail or password (once per workflow)
          # The token can read contents and write packages (specified in permissions)
          password: ${{secrets.GITHUB_TOKEN}}
      # Build and push the content to the Docker image following the tags-path
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: src/CiCd
          push: true
          tags: ${{env.REGISTRY}}/${{env.GITHUB_ACTOR}}/${{env.IMAGE_NAME}}:latest
